# The compiler this repository is developed and checked with: local `cargo` and every CI job that
# does not name a toolchain of its own. It does not reach anyone depending on these crates; what
# they need is `rust-version` in Cargo.toml.
#
# Pinned to an exact release rather than `stable` so that a new Rust, with its new clippy lints
# and rustfmt output, arrives as a reviewed Renovate pull request instead of turning an unrelated
# pull request red on the day it ships.
#
# Three jobs deliberately run something else. `msrv` installs the `rust-version` floor, and `doc`
# and `fuzz` install nightly, all through the action's `toolchain` input, whose `rustup override`
# takes precedence over this file. `crates/*/fuzz/` carry nightly pins of their own, which win
# for anything run inside those directories.
[toolchain]
channel = "1.99.1"
# What the `fmt` and `clippy` jobs run.
components = ["rustfmt", "clippy"]
# No `targets`: `thumbv7em-none-eabi` is only the `no-std` job's proof that the crates build
# without `std`, and that job adds it itself.
profile = "minimal"
