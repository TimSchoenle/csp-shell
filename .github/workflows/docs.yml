name: docs

# The three `README.md` files are generated from `.github/templates/*.hbs`. On a pull request the
# `render` job in generate.yaml renders them and generate-commit.yaml commits the result, so the
# numbers they quote are never edited by hand.
#
# Everywhere nothing commits — a push to `main`, a pull request from a fork — this workflow renders
# in `check` mode instead, writing nothing and failing if a committed `README.md` is stale. Without
# it, editing a `README.md` directly would appear to work right up until the next pull request
# silently reverted it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: readme
    # The complement of the `render` job in generate.yaml: it covers the pushes to `main` that no
    # pull request rendered, and the fork pull requests that could not be committed to.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the version payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # Same two inputs as in `render`, for the same two reasons. `branch` in particular has to
      # agree across the jobs, or the badge URL this one renders would differ from the one the
      # pull request committed and the gate would fail on every merge.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          manifest: crates/csp-shell/Cargo.toml
          branch: ${{ github.event.repository.default_branch }}
          tag-prefix: csp-shell-v
          extra: ${{ steps.config.outputs.json }}

      # Each writes nothing; each fails with the first differing line when its output is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify crates/csp-shell/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/csp-shell.README.md.hbs
          output: crates/csp-shell/README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify crates/csp-policy/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/csp-policy.README.md.hbs
          output: crates/csp-policy/README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true
