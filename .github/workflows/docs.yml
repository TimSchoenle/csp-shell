name: docs

# The three `README.md` files are generated from `.github/templates/*.hbs`. This workflow is what
# makes that claim true in both directions.
#
# On a pull request it renders all three and commits the result to the branch, so the numbers they
# quote — the tags their install snippets pin and the MSRV their badges show — are never edited by
# hand. The case that matters is the release-please pull request: that commit is the one which
# changes `version` in a crate manifest, so it is also the one where a README would otherwise
# start advertising the previous tag. Rendering here means the released READMEs already point at
# the tags the merge is about to create.
#
# Everywhere it cannot commit — a push to `main`, a pull request from a fork — it renders in
# `check` mode instead, writing nothing and failing if a committed `README.md` is stale. Without
# it, editing a `README.md` directly would appear to work right up until the next pull request
# silently reverted it.
#
# All three are rendered by separate steps but committed by one, on purpose: the API call that
# makes a verified commit rejects one whose parent has moved, so three commits in a row would
# race with each other for no reason a reader could act on.

on:
  pull_request:
  push:
    branches: [main]

# Shared with update-files.yaml, not scoped to this workflow: both commit to the pull request
# branch, and the API call that makes a verified commit rejects one whose parent has moved. Two
# renders of the same branch racing would leave one of them failing for no reason a reader could
# act on, so they queue instead. `cancel-in-progress: false` for the same reason — a cancelled
# run here means a branch left holding a half-generated file.
concurrency:
  group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  # `render` and `render-commit` are two halves, and the split is the security boundary of this
  # workflow. `render` runs the pull request's own script and templates, so it holds no secret
  # and a read-only `GITHUB_TOKEN`, and hands on only a patch artifact. `render-commit` holds the
  # maintenance App's private key and the write token minted from it, runs nothing from the
  # checkout, and `allowed_paths` refuses any path other than the three READMEs.
  render:
    name: render
    # A fork's branch is not in this repository, so there would be nothing to commit to.
    # `check` below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The head of the branch, not the merge commit: the render has to read the manifests the
      # pull request proposes, and the patch has to apply on top of the commit the branch points
      # at, which is the one `commit-patch` checks it against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Generate the version payload
        id: config
        # Invoked through `bash` rather than executed: the repository is authored on Windows,
        # where git does not record the executable bit.
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # The repository facts the three templates share: name, description, licence, links and the
      # docs index. `manifest` names a member because the workspace root is a virtual manifest
      # with no `[package]` table for the action to read. `branch` is the default branch rather
      # than the action's `github.ref_name` default, which on a pull request is `<number>/merge`
      # and would put that into the CI badge's query string.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@421289db958b620e2772ba46d11d014bf25a371b # tag=actions-common-readme-variables-v2.1.0
        with:
          manifest: crates/csp-shell/Cargo.toml
          branch: ${{ github.event.repository.default_branch }}
          tag-prefix: csp-shell-v
          extra: ${{ steps.config.outputs.json }}

      - name: Render the workspace README
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Render the csp-shell README
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/csp-shell.README.md.hbs
          output: crates/csp-shell/README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Render the csp-policy README
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/csp-policy.README.md.hbs
          output: crates/csp-policy/README.md
          variables: ${{ steps.variables.outputs.variables }}

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
        with:
          artifact_name: docs-readmes
          paths: 'README.md crates/csp-shell/README.md crates/csp-policy/README.md'

  render-commit:
    name: render-commit
    needs: render
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.render.outputs.has_changes == 'true'
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch the commit the patch applies to; the write uses the App token
    steps:
      # Checkout, the token mint, the artifact download and the GraphQL commit, and nothing else.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Only git's objects are needed: the patch is applied on top of this commit's tree. Nothing
      # in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # An App installation token, so the commit is verified and — unlike one made with
      # `GITHUB_TOKEN` — re-triggers the checks on the branch it lands on.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write

      # The artifact name is a literal, not the render job's output: that job ran the pull
      # request's code. One commit for all three, for the reason given at the top of this file.
      - name: Commit the rendered READMEs
        id: readmes
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: docs-readmes
          # The three files the templates render to. Any other path fails this job.
          allowed_paths: 'README.md crates/csp-shell/README.md crates/csp-policy/README.md'
          commit_message: 'docs: render READMEs from templates'

      - name: Summarise
        env:
          OUTCOME: ${{ steps.readmes.outputs.outcome }}
          COMMIT_URL: ${{ steps.readmes.outputs.commit_url }}
        run: |
          if [ "${OUTCOME}" = "committed" ]; then
            echo "READMEs re-rendered: ${COMMIT_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing committed (${OUTCOME})." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: readme
    # The complement of `render`: it covers the pushes to `main` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the version payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # Same two inputs as in `render`, for the same two reasons. `branch` in particular has to
      # agree across the jobs, or the badge URL this one renders would differ from the one the
      # pull request committed and the gate would fail on every merge.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@421289db958b620e2772ba46d11d014bf25a371b # tag=actions-common-readme-variables-v2.1.0
        with:
          manifest: crates/csp-shell/Cargo.toml
          branch: ${{ github.event.repository.default_branch }}
          tag-prefix: csp-shell-v
          extra: ${{ steps.config.outputs.json }}

      # Each writes nothing; each fails with the first differing line when its output is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify crates/csp-shell/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/csp-shell.README.md.hbs
          output: crates/csp-shell/README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify crates/csp-policy/README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/csp-policy.README.md.hbs
          output: crates/csp-policy/README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true
