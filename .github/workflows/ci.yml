name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing granted by default: each job requests only the scopes it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
      # The fuzz harnesses are workspaces of their own, so `--all` does not reach them. They are
      # formatted in the `fuzz` job, which already has the nightly their toolchain files pin.
      - run: cargo fmt --all --check

  # Feature-gated code rots silently. Four features make the full powerset cheap, so there is no
  # reason to cap the depth — and without this, code behind `#[cfg(feature = "nonce")]` breaks
  # under `--no-default-features` and nobody notices for a release cycle.
  #
  # Both platforms, because the scanner's newline normalisation is a line-endings behaviour and
  # linting it on one platform is linting nothing.
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack
      - run: cargo hack --workspace --feature-powerset clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack
      # `each-feature` first, so a test that only compiles because another feature happened to be
      # on is a failure rather than a coincidence. `cargo test` rather than `nextest`: the public
      # API is documented with runnable examples, and nextest does not run doctests.
      - run: cargo hack --workspace --each-feature test
      - run: cargo test --workspace --all-features

  # Kept apart from `test` and out of `ci`, so a Codecov outage fails this job alone. The upload
  # authenticates with this job's OIDC token, so the job needs no environment and no secret.
  # `.github/codecov.yml` decides what the Codecov statuses check.
  #
  # The action runs `cargo llvm-cov nextest`, which skips doctests, so lines reached only by a
  # documentation example count as uncovered.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: TimSchoenle/actions/actions/rust/coverage-codecov@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-rust-coverage-codecov-v2.0.4
        with:
          test_arguments: --workspace --all-features
          flags: rust

  # `no_std + alloc` against a target that genuinely has no `std`, rather than against a host that
  # merely was not asked to link it. A crate that claims `no_std` and has never been built for a
  # bare-metal target is a crate that claims it.
  no-std:
    name: no_std
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: thumbv7em-none-eabi
      - run: cargo build -p csp-shell --no-default-features --target thumbv7em-none-eabi
      - run: cargo build -p csp-policy --target thumbv7em-none-eabi

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read from the manifest rather than repeated inline, so the pin cannot drift from the
      # `rust-version` it is meant to verify. Renovate is configured not to bump that key: the
      # MSRV is a compatibility promise, and moving it is a decision rather than an update.
      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # There is no Cargo.lock, so this resolves fresh, and by default to the newest versions even
      # when they need a newer Rust (sha2 0.11.1 raised its floor to 1.88 in a patch release).
      # `fallback` resolves the way a consumer on the MSRV does: to the newest versions whose
      # `rust-version` the toolchain satisfies. What it then checks is the promise the MSRV makes.
      - run: cargo check --workspace --all-features --all-targets
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

  doc:
    name: doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # `--cfg docsrs` is what makes the feature requirements visible in the rendered docs, so it
      # has to compile on nightly or docs.rs publishes a broken page for a release nobody can
      # take back.
      RUSTDOCFLAGS: "-D warnings --cfg docsrs"
      # Cleared for this job only. The workflow-wide `-D warnings` applies to every crate being
      # compiled, dependencies included, and nightly gains lints on its own schedule — so leaving
      # it on here makes an unrelated toolchain release able to fail a pull request that changed
      # nothing. Warnings in *this* repository's code are enforced by the stable `clippy` job.
      # `RUSTDOCFLAGS` above still denies warnings, which is what this job is actually about.
      RUSTFLAGS: ""
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack
      # What docs.rs itself renders, so a broken page is caught before a release nobody can take
      # back.
      - run: cargo doc --workspace --all-features --no-deps

      # Then every other feature set. A doc comment compiled in every configuration can link an
      # item that only some configurations define, and the run above resolves that link while no
      # other run can. Parts of the documentation are gated too — `headers`'s `# Panics` section,
      # the `no_run` fence on the crate-root example — so they render in one subset of the sets
      # below. Four features make the full powerset cheap.
      - run: cargo hack --workspace --feature-powerset doc --no-deps

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Each crate's `fuzz/` is a workspace of its own on a nightly toolchain, so none of the jobs
  # above touch it.
  #
  # Two things run here. The replay suite is the gate: it re-runs every committed seed and a
  # deterministic sweep through the oracles on a plain `cargo test`, no sanitizer involved, and a
  # reproducer promoted into `corpus/` keeps being checked forever. The short campaign after it is
  # a smoke test that the libFuzzer plumbing still links — not a hunt; a real hunt is a human
  # running `cargo fuzz run` for hours.
  fuzz:
    name: fuzz (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Cleared for the same reason as in `doc`: this job is on nightly and compiles
      # `libfuzzer-sys` and `arbitrary` from source, so a workflow-wide `-D warnings` hands a
      # nightly release the ability to fail a pull request. The harness's own lints are denied
      # explicitly in the clippy step below.
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: csp-policy
            targets: parse_source parse_terms build_policy
            dictionary: csp.dict
          - crate: csp-shell
            targets: csp_directive csp_builder scan_shell shell_to_header
            dictionary: shell.dict
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          components: clippy, rustfmt
      # The tool has to be named through the input rather than an `@cargo-fuzz` tag: tag-style
      # references get rewritten to version tags, which leaves the action with no tool to install
      # and the run failing later with a bare `no such command: fuzz`.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz

      - name: Format the harness
        working-directory: crates/${{ matrix.crate }}/fuzz
        run: cargo fmt --all --check

      - name: Lint the oracles
        working-directory: crates/${{ matrix.crate }}/fuzz
        run: cargo clippy --all-targets -- -D warnings

      # The step above cannot see the harness's `[lints.rustdoc]` table, because rustdoc lints run
      # under rustdoc and nowhere else. Without this the oracles' intra-doc links are the one part
      # of the repository nothing checks.
      - name: Document the oracles
        working-directory: crates/${{ matrix.crate }}/fuzz
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

      - name: Replay the seeds
        working-directory: crates/${{ matrix.crate }}/fuzz
        env:
          # Larger than the local default: this runs once per push, not on every `cargo test`.
          CSP_FUZZ_ITERATIONS: "20000"
        run: cargo test

      # `--target` is not optional: cargo fuzz defaults to the triple its own binary was built
      # for, and the prebuilt binary is musl. Building the fuzzer against musl links libc
      # statically, which the sanitizer refuses outright.
      #
      # Interpolation stays out of the script body — the matrix values arrive as environment
      # variables, so a value can never be spliced into the shell as code.
      - name: Short campaign
        env:
          TARGETS: ${{ matrix.targets }}
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          for target in ${TARGETS}; do
            # libFuzzer creates the corpus directory only when it is the sole one given; with a
            # seed directory alongside it, an absent corpus directory is a hard error.
            mkdir -p "fuzz/corpus/${target}"
            seeds=""
            if [ -d "fuzz/seeds/${target}" ]; then
              seeds="fuzz/seeds/${target}"
            fi
            cargo fuzz run --target "${host}" "${target}" \
              "fuzz/corpus/${target}" ${seeds} \
              -- "-dict=fuzz/dictionaries/${DICTIONARY}" -max_total_time=30
          done

      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.crate }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore

  # The single required check. It fails if any job failed and passes when jobs were skipped, so
  # branch protection needs one entry that cannot silently stop existing.
  ci:
    name: ci
    if: always()
    needs: [fmt, clippy, test, no-std, msrv, doc, deny, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all gates green"
