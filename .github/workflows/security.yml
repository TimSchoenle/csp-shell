name: security

# Static analysis of the workflows themselves — the one body of code in this repository with
# write access to it, and the one nothing else checks. Catches unpinned actions, over-broad
# `permissions`, credentials persisted into `.git/config`, and `${{ }}` interpolated into a
# `run:` block, which is a shell injection rather than a template.
#
# `pedantic` on purpose: the default persona reports only what is provably exploitable today,
# pedantic reports the shape that becomes exploitable after one careless edit.
#
# Dependency advisories are not here. `cargo deny check` in ci.yml already covers them against
# the committed `Cargo.lock`, and the weekly schedule below has a sibling there so an advisory
# published against an unchanged tree is still caught. Two gates reading two configurations for
# one advisory database is how they end up disagreeing.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: zizmor's audit set grows between releases, and a workflow that was clean when it
    # was written is not clean forever.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to check out the workflows
      actions: read # to resolve the actions they reference
      security-events: write # to upload the SARIF findings to code scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          persona: pedantic
