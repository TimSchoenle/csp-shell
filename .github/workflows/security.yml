name: security

# Static analysis of the workflows themselves — the one body of code in this repository with
# write access to it, and the one nothing else checks. Catches unpinned actions, over-broad
# `permissions`, credentials persisted into `.git/config`, and `${{ }}` interpolated into a
# `run:` block, which is a shell injection rather than a template.
#
# jactionlint keeps every actionlint check and has a rule for every zizmor audit. `pedantic` on
# purpose: the default profile reports only what is provably exploitable today, pedantic reports
# the shape that becomes exploitable after one careless edit. It runs online, so it also asks
# GitHub about the actions in use (impostor commits, vulnerable versions, moved tags, archived
# repositories); strict-exit fails it on findings of every level. The SARIF goes to code scanning
# under the category jactionlint. .github/jactionlint.yaml turns off the rules this repository
# does not want.
#
# Dependency advisories are not here. `cargo deny check` in ci.yml already covers them against
# the committed `Cargo.lock`, and the weekly schedule below has a sibling there so an advisory
# published against an unchanged tree is still caught. Two gates reading two configurations for
# one advisory database is how they end up disagreeing.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: advisories keep being published, and a workflow that was clean when it was written is
    # not clean forever.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the workflows
      security-events: write # to upload the SARIF findings to code scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-security-jactionlint-v1.1.3
        with:
          online: 'true'
          strict-exit: 'true'
