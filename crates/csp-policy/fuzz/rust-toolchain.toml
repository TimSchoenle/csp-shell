# Nightly, and only here. `libfuzzer-sys` compiles the crate under test with
# `-Z sanitizer=address`, which is nightly-only.
#
# This is what makes a plain `cargo build` *inside* this directory work, and it is where the
# requirement is written down. It is deliberately NOT how `cargo fuzz` selects its toolchain:
# `cargo fuzz` is invoked from `crates/csp-policy` (it locates `./fuzz` from there), where this
# file does not apply — hence the explicit `cargo +nightly fuzz …` in the README.
[toolchain]
channel = "nightly"
components = ["rust-src", "clippy"]
