[package]
name = "csp-policy"
# Not inherited: the two crates version independently, and this is the number release-please
# bumps from the conventional commits that touched `crates/csp-policy`.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A fully typed Content-Security-Policy: every directive, source expression and token as a Rust type, rendered to a header value that cannot carry an injection."
documentation = "https://docs.rs/csp-policy"
readme = "README.md"
keywords = ["csp", "security-headers", "builder", "no-std"]
categories = ["web-programming", "no-std"]

# `no_std + alloc` and dependency-free. A policy is a data structure and a string; neither needs a
# dependency, and this crate sits under a security header that every response carries.
[dependencies]

[dev-dependencies]
# Reference implementation for the differential test over the hand-rolled encoder.
base64.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
