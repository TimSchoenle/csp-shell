# Detached from the crate under test: a fuzz harness needs nightly and its own profile, and it
# must never appear in a consumer's dependency graph. As a workspace member it would also drag
# nightly into `cargo fmt --all`, `cargo clippy --workspace` and the resolution the `msrv` job
# measures at 1.85.
[workspace]

[package]
name = "csp-shell-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The oracles live in a library, not in the target binaries. `cargo fuzz` needs
# `-Z sanitizer=address`, which is nightly-only and on Windows needs a runtime that ships with
# Visual Studio rather than with rustup — an oracle that can only run under that toolchain is an
# oracle nobody checks. With the bodies here, `tests/seeds.rs` replays every committed seed on a
# plain `cargo test`, anywhere, and the fuzzer's job is to find new inputs to add to it.
[lib]
name = "csp_shell_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.csp-shell]
path = ".."
features = ["std", "nonce", "cloudflare"]

# `-Z sanitizer=address` instruments the crate under test, so the fuzz binary must be built with
# debug assertions on: an arithmetic overflow that panics is a finding, and one that silently
# wraps is not. The scanner does index arithmetic over offsets it computes from the document,
# which is exactly the shape that wraps quietly in a release profile — an unterminated tag once
# produced a reversed range.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
# `cargo fuzz` sets `--cfg fuzzing` through RUSTFLAGS, so cargo cannot see it declared anywhere
# and `unexpected_cfgs` would fire on every target shim.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# The same set as the crate under test, restated because this is a workspace of its own. An
# oracle is the thing deciding whether a finding is real, so it is the last place to accept
# sloppiness.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Nothing here is called for its return value by anyone but the oracles themselves.
must_use_candidate = "allow"

# `test`/`doc`/`bench = false` on every target: a `fuzz_target!` binary has no `main` a test
# harness can call, and `cargo test` in here would fail to link it before reaching `tests/`.

[[bin]]
name = "csp_directive"
path = "fuzz_targets/csp_directive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csp_builder"
path = "fuzz_targets/csp_builder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scan_shell"
path = "fuzz_targets/scan_shell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell_to_header"
path = "fuzz_targets/shell_to_header.rs"
test = false
doc = false
bench = false
